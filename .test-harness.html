<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>找茬工作台 · 界面验证</title>
<style>
  :root {
    --dsw-alias-bg-base:#fbfbfc; --dsw-alias-bg-layer-1:#fff; --dsw-alias-bg-layer-2:#f5f6f8;
    --dsw-alias-border-l2:#e3e5e9; --dsw-alias-label-primary:#1c1d21; --dsw-alias-label-secondary:#5a5c63;
    --dsw-alias-label-tertiary:#8b8d95; --dsw-alias-interactive-bg-hover:#eceef2;
    --dsw-alias-state-error-primary:#d9534f; --dsw-alias-state-warning-primary:#c8860d;
    /* 宿主主题里的品牌色。少了它，图标背景那条 gradient 会整条失效，
       测试就看不到真实外观（曾经因此漏掉一个「图标不显示」的问题）。 */
    --dsw-alias-state-business-primary:#0F9C87;
  }
  html,body{margin:0;height:100%;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fbfbfc;color:#1c1d21}
  #root{height:100%;display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* 极简模块加载器：client.js 是 __ModuleLoader__.load({id,factory}) 形式的单文件模块 */
window.__ModuleLoader__ = {
  mods: {},
  load({ id, factory }) { this.mods[id] = factory((name) => (name === 'react' ? React : window[name])) }
}
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="./lib/client.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
const FAKE_TREE = {
  '': [
    { name: 'src', path: 'src', type: 'dir', hasChildren: true },
    { name: 'index.html', path: 'index.html', type: 'file', size: 420 }
  ],
  'src': [{ name: 'main.js', path: 'src/main.js', type: 'file', size: 900 }]
}
const FAKE_FILES = {
  'index.html': '<!doctype html>\n<div id="app">demo</div>',
  'src/main.js': 'console.log("demo")'
}

const json = (body) => new Response(JSON.stringify(body), { headers: { 'content-type': 'application/json' } })

/**
 * 关键的一条：/run-detail 返回一条「整页横向溢出」的历史记录，
 * 它的 target 是 html / body 且没有 rect —— 正是用户点不动的那种。
 */
window.fetch = async (input, init) => {
  const url = String(typeof input === 'string' ? input : input.url)
  if (url.includes('/health')) return json({ browser: 'msedge', driver: true })
  if (url.includes('/instances')) {
    return json({ instances: [
      { id: 'inst-1', name: 'demo-project', projectPath: 'D:/demo', url: 'http://127.0.0.1:5599', devServer: null }
    ] })
  }
  if (url.includes('/home')) return json({ root: 'D:/demo', exists: true })

  /**
   * 三条运行记录，对应三种结局：
   *   run-bad   有缺陷      → 数字徽标
   *   run-clean 测完干净    → ✓
   *   run-failed 页面没打开 → — （绝不能用 ✓）
   * 用 ?scenario=runs 切换，默认只给横向溢出那一条。
   */
  // scenario 要读「页面本身的地址」，不是请求地址 ——
  // 前端请求 /runs 时不会把页面的 query 带过去。
  const scenario = new URL(location.href).searchParams.get('scenario') || 'single'

  if (url.includes('/runs')) {
    if (scenario === 'runs') {
      return json({ runs: [
        { id: 'run-bad', instanceName: 'demo-project', startedAt: new Date(Date.now() - 300000).toISOString(),
          finishedAt: new Date().toISOString(), durationMs: 27200, ok: true,
          summary: { total: 17, places: 17 }, combinations: [] },
        { id: 'run-clean', instanceName: 'demo-project', startedAt: new Date(Date.now() - 240000).toISOString(),
          finishedAt: new Date().toISOString(), durationMs: 9100, ok: true,
          summary: { total: 0, places: 0 }, combinations: [] },
        { id: 'run-failed', instanceName: 'demo-project', startedAt: new Date(Date.now() - 180000).toISOString(),
          finishedAt: new Date().toISOString(), durationMs: 2100, ok: false,
          error: '无法打开页面：页面返回了错误状态码（http://127.0.0.1:5173/）。服务在响应，但返回的是错误页（常见的是 404）。',
          summary: { total: 0, places: 0 }, combinations: [] }
      ] })
    }
    return json({ runs: [
      { id: 'run-hs', instanceName: 'demo-project', startedAt: new Date(Date.now() - 60000).toISOString(),
        finishedAt: new Date().toISOString(), durationMs: 5000, ok: true,
        summary: { total: 1, places: 1 }, combinations: [] }
    ] })
  }
  if (url.includes('/files')) {
    const p = new URL(url, location.origin).searchParams.get('path') || ''
    return json({ ok: true, root: 'D:/demo', path: p, entries: FAKE_TREE[p] || [] })
  }
  if (url.includes('/file?')) {
    const p = new URL(url, location.origin).searchParams.get('path') || ''
    const text = FAKE_FILES[p]
    if (text === undefined) return new Response(JSON.stringify({ error: '没有这个文件' }), { status: 404 })
    return json({ ok: true, path: p, name: p.split('/').pop(), size: text.length, binary: false, text })
  }
  if (url.includes('/run-detail')) {
    const id = new URL(url, location.origin).searchParams.get('id') || ''
    const base = {
      instanceName: 'demo-project', url: 'http://127.0.0.1:5599',
      startedAt: new Date().toISOString(), finishedAt: new Date().toISOString()
    }
    // 页面没打开：ok=false、没有 issues、带原因。
    // 面板必须画成「没测成」，而不是绿色的「本次没有发现缺陷」。
    if (id === 'run-failed') {
      return json({ run: { ...base, id: 'run-failed', durationMs: 2100, ok: false,
        error: '无法打开页面：页面返回了错误状态码（http://127.0.0.1:5173/）。服务在响应，但返回的是错误页（常见的是 404）。',
        plan: null, issues: [], summary: { total: 0, places: 0, hits: 0 }, combinations: [] } })
    }
    // 真测完且干净
    if (id === 'run-clean') {
      return json({ run: { ...base, id: 'run-clean', durationMs: 9100, ok: true,
        plan: { supportsDark: false, viewports: [{ label: '桌面' }], detectors: ['overflow'], discoveredStates: 2, summary: '桌面 · 亮色' },
        issues: [], summary: { total: 0, places: 0, hits: 0 }, combinations: [{ label: '桌面 · 亮色', issueCount: 0 }] } })
    }
    // 有缺陷
    if (id === 'run-bad') {
      return json({ run: { ...base, id: 'run-bad', durationMs: 27200, ok: true,
        plan: { supportsDark: false, viewports: [{ label: '桌面' }], detectors: ['overflow'], discoveredStates: 3, summary: '桌面 · 亮色' },
        issues: [
          { kind: 'overflow', title: '文字溢出', detail: '内容宽度 420px 超过容器 360px', target: '.card > h3',
            suggestion: '给容器加 overflow-wrap:anywhere', severity: 'warning', rect: null, hits: 3, combos: ['桌面 · 亮色'], states: [] }
        ],
        summary: { total: 1, places: 1, hits: 3 }, combinations: [{ label: '桌面 · 亮色', issueCount: 1 }] } })
    }
    return json({
      run: {
        id: 'run-hs', instanceName: 'demo-project', url: 'http://127.0.0.1:5599',
        startedAt: new Date().toISOString(), finishedAt: new Date().toISOString(), durationMs: 5000,
        ok: true,
        plan: { supportsDark: false, viewports: [{ label: '桌面' }], detectors: ['horizontalScroll'], discoveredStates: 2, summary: '桌面 · 亮色' },
        // 这条没有 rect：目标就是 html / body。界面上必须仍可点，且点了给出解释。
        issues: [
          { kind: 'horizontalScroll', title: '页面横向超出 246px',
            detail: '页面可滚动宽度 1146px，视口宽度 900px；窄屏上可能出现意外横向滚动。',
            target: 'html / body', label: 'html / body', rect: null,
            suggestion: '检查固定宽度、最小宽度、绝对定位和不可换行内容；让内容随视口收缩或在局部容器内滚动。',
            severity: 'error', hits: 1, combos: ['桌面 · 亮色'], states: [] }
        ],
        summary: { total: 1, places: 1, hits: 1 }, combinations: [{ label: '桌面 · 亮色', issueCount: 1 }]
      }
    })
  }
  return json({ ok: true })
}

const mod = window.__ModuleLoader__.mods['dsh-ux-workbench']
/**
 * 假 i18n：真的要去查字典。
 *
 * 早先这里写成 (key) => key，于是 t('runFailed') 返回的是 key 本身 ——
 * 断言「说检测没有完成」必然失败，看着像产品有 bug，其实是脚手架在骗人。
 */
let dict = {}
const translate = (key) => (key in dict ? dict[key] : key)
let registered = null
const ctx = {
  effect(fn) { if (typeof fn === 'function') fn() },
  locale: {
    register: (ns, d) => { dict = d.zh || d; return d },
    bind: () => translate
  },
  desktopWorkbenches: {
    register(options, Panel) { registered = { options, Panel } }
  }
}
mod.apply(ctx)
window.__PANEL__ = registered

// 渲染面板
const root = ReactDOM.createRoot(document.getElementById('root'))
root.render(React.createElement('div', { style: { height: '100%', display: 'flex' } },
  React.createElement(registered.Panel, { service: { call: async () => ({}) }, conversation: null })))
</script>
</body>
</html>
