<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体验缺陷演示场</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --card: #ffffff;
    --border: #e5e5e5; --primary: #2563eb; --muted: #f5f5f5;
  }
  html[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card: #1e1e1e;
    --border: #2e2e2e; --primary: #60a5fa; --muted: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --fg: #e8e8e8; --card: #1e1e1e;
      --border: #2e2e2e; --primary: #60a5fa; --muted: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px 48px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    transition: background .25s, color .25s;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; opacity: .6; margin: 0 0 24px; }
  h2 { font-size: 13px; margin: 26px 0 10px; opacity: .55; font-weight: 500; letter-spacing: .02em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); cursor: pointer; font-size: 14px;
    font-family: inherit; transition: background .15s;
  }
  .btn:hover { background: var(--muted); }
  .btn-primary { background: var(--primary); color: #fff; border-color: transparent; }
  .btn-primary:hover { filter: brightness(1.07); }

  /* 缺陷 1：按钮固定宽度 + 裁切，且没有 ellipsis 兜底 */
  .btn-fixed {
    width: 76px; height: 36px; overflow: hidden; white-space: nowrap;
    background: var(--primary); color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-family: inherit;
  }

  /* 缺陷 2：点击目标过小 */
  .btn-tiny {
    width: 24px; height: 20px; padding: 0; font-size: 7px; line-height: 1;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
    border-radius: 3px; cursor: pointer;
  }

  /* 缺陷 3：硬编码白底，不跟随主题 */
  .card-fixed {
    background: #ffffff; color: #333333;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; width: 260px; min-height: 108px;
  }
  .card {
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; width: 260px; min-height: 108px;
  }
  .card-fixed strong, .card strong { font-size: 13.5px; }
  .card-fixed p, .card p { font-size: 12.5px; margin: 8px 0 0; opacity: .8; }

  /* 缺陷 4：焦点被抹掉 */
  .btn-nofocus:focus { outline: none; }
  .btn-nofocus:focus-visible { outline: none; }

  /* 缺陷 5：低对比度文字 */
  .low-contrast { color: #b8b8b8; font-size: 13px; }
  html[data-theme="dark"] .low-contrast { color: #4a4a4a; }

  /* 缺陷 6：点击反馈延迟 */
  #slow-result { font-size: 13px; color: var(--primary); min-height: 20px; }

  /* 缺陷 7：动画 */
  .janky {
    width: 56px; height: 56px; background: var(--primary); border-radius: 10px;
    margin-top: 14px; transition: transform .35s ease;
  }
  .janky.moved { transform: translateX(min(420px, 60vw)); }
</style>
</head>
<body>
  <h1>体验缺陷演示场</h1>
  <p class="sub">这个页面故意放了七类体验缺陷。用「视觉体检」模板跑一遍，能看到每一类是如何被检出的。</p>

  <h2>1 · 按钮文字溢出（固定 76px 宽）</h2>
  <div class="row">
    <button class="btn-fixed">这是一个非常非常长的按钮文本</button>
    <button class="btn btn-primary">正常按钮</button>
  </div>

  <h2>2 · 点击目标过小（24×20px）</h2>
  <div class="row">
    <button class="btn-tiny" aria-label="关闭">×</button>
    <button class="btn-tiny" aria-label="信息">i</button>
    <button class="btn">正常尺寸按钮</button>
  </div>

  <h2>3 · 暗色模式残留亮色卡片</h2>
  <div class="row">
    <div class="card-fixed">
      <strong>硬编码白底卡片</strong>
      <p>切到暗色后我依然是白的。</p>
    </div>
    <div class="card">
      <strong>正常跟随主题的卡片</strong>
      <p>我会跟随主题变色。</p>
    </div>
  </div>

  <h2>4 · 键盘焦点不可见</h2>
  <div class="row">
    <button class="btn btn-nofocus">我的焦点被抹掉了</button>
    <button class="btn">正常焦点按钮</button>
  </div>

  <h2>5 · 低对比度文字</h2>
  <div class="card">
    <p class="low-contrast">这段文字对比度过低，很难看清。</p>
    <p style="font-size:12.5px">这段文字对比度正常。</p>
  </div>

  <h2>6 · 点击反馈延迟（600ms 后才响应）</h2>
  <div class="row">
    <button class="btn btn-primary" id="slow-btn">提交（慢响应）</button>
    <button class="btn" id="fast-btn">提交（快响应）</button>
    <span id="slow-result"></span>
  </div>

  <h2>7 · 动画</h2>
  <button class="btn" id="move-btn">触发移动动画</button>
  <div class="janky" id="janky"></div>

<script>
  // 主题：支持 ?theme=dark|light 显式指定，也支持跟随系统
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    if (q === 'dark' || q === 'light') document.documentElement.dataset.theme = q;
  })();

  document.getElementById('slow-btn').addEventListener('click', function () {
    setTimeout(function () {
      document.getElementById('slow-result').textContent = '已提交（600ms）';
    }, 600);
  });

  document.getElementById('fast-btn').addEventListener('click', function () {
    document.getElementById('slow-result').textContent = '已提交（立即）';
  });

  document.getElementById('move-btn').addEventListener('click', function () {
    document.getElementById('janky').classList.toggle('moved');
  });
</script>
</body>
</html>
